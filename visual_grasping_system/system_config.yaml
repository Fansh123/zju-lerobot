# ============================================================================
#  视觉抓取与放置系统 - 统一配置文件
#  修改参数后重新运行程序即可生效，无需改代码
# ============================================================================

# ---------------------------------------------------------------------------
#  机械臂硬件连接
# ---------------------------------------------------------------------------
arm:
  port: COM18                  # 串口号 (Windows: COMx, Linux: /dev/ttyUSBx)
  baudrate: 1000000            # 波特率 (Feetech STS3215 固定1Mbps)
  urdf_path: "../SO-ARM100/Simulation/SO101/so101_new_calib.urdf"  # URDF模型路径 (相对/绝对)

  # 舵机运动参数
  default_speed: 500           # 默认速度 (0-1023)
  default_acceleration: 50     # 默认加速度 (0-254)

# ---------------------------------------------------------------------------
#  摄像头参数
# ---------------------------------------------------------------------------
camera:
  camera_id: 1                 # 摄像头设备ID (默认1=外接USB摄像头, 0=内置摄像头)
  resolution: [640, 480]       # 分辨率 [宽, 高]
  image_center_x: 320          # 画面中心X坐标 (宽/2)
  image_center_y: 240          # 画面中心Y坐标 (高/2)

  # --- 红色 HSV 范围 (物块 & 方框检测) ---
  red_hsv:
    h_low1: 0                  # 红色低段 H (0-10)
    h_high1: 10
    s_low1: 100
    s_high1: 255
    v_low1: 100
    v_high1: 255
    h_low2: 160                # 红色高段 H (160-180)
    h_high2: 180
    s_low2: 100
    s_high2: 255
    v_low2: 100
    v_high2: 255

  # --- 蓝色 HSV 范围 (物块检测) ---
  blue_hsv:
    h_low: 100
    h_high: 130
    s_low: 100
    s_high: 255
    v_low: 100
    v_high: 255

  # 物块实际尺寸 (用于深度估计，当前未启用深度)
  real_object_size: 0.022       # 22mm 边长正方体

# ---------------------------------------------------------------------------
#  抓取策略 (grasping_strategy.py)
#  流程: 开夹爪 → 转腕90° → 视觉伺服居中 → 向左微调 → 下降Z → 腕部降低 → 向前 → 闭合 → 提升
# ---------------------------------------------------------------------------
grasping:
  center_threshold_y: 20        # Y轴居中容忍误差 (像素)，越小越精确但可能震荡
  max_iterations: 50            # 居中循环最大迭代次数
  joint_step: 0.03              # 关节0每次调整步长 (弧度), 约1.72°

  grasp_z: 0.005               # 抓取时末端Z高度 (米), 即夹爪下探到10mm桌面高度
  forward_distance: 0.100       # 向前移动距离 (米), 沿关节0径向方向

  gripper_open: 1.1             # 夹爪张开角度 (70°→rad)
  gripper_close: -1.1           # 夹爪闭合角度 (-57°→rad)
  wrist_roll_angle: -1.5708     # 腕部旋转角 = -π/2, 摄像头横装转90°

  center_adjust_angle: -0.13    # 居中后向左微调角度 (弧度), 约-7.45°, 让物块偏右以便抓取包入

  # 自主搜索参数 (当视野中找不到物块时触发)
  search:
    joint_0_min: -1.5           # 关节0扫描下限 (弧度)
    joint_0_max: 1.5            # 关节0扫描上限 (弧度)
    step: 0.15                  # 扫描步长 (弧度), 约8.6°
    sweep_count: 3              # 扫描轮数 (左右各一次算一轮)
    forward_step: 0.030         # 每轮扫描后向前移动距离 (米)

# ---------------------------------------------------------------------------
#  放置策略 (placing_strategy.py)
#  流程: 预检测X偏差 → Y轴居中 → 偏移调整 → 重新检测X偏差 → 系数前进 → 下降释放
# ---------------------------------------------------------------------------
placing:
  center_threshold_y: 8         # Y轴居中容忍误差 (像素), 比抓取更严格保证定位精度
  max_iter: 60                  # 居中循环最大迭代次数
  joint_step: 0.025             # 关节0每次调整步长 (弧度), 约1.43°

  forward_coefficient: 0.0015   # 前进距离系数 (米/像素), 前进距离 = |X偏差| × 系数
  place_z: 0.015                # 放置时末端Z高度 (米), 即放到15mm高度
  retract_z: 0.12               # 放置后提升高度 (米), 从当前Z升高120mm

  gripper_open: 1.1             # 夹爪张开角度

  # 起始姿态 (摄像头朝下, 在 placing_config.yaml 中保存/修改)
  # center_offset_deg: 3.0      # 居中后人为向右偏转角度 (度), 在 placing_config.yaml 中设置
